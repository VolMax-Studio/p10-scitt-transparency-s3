<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">P10 S3: from live registration to offline replay</title>
  <desc id="desc">Signed statements are authenticated by the Go registration facade and appended to Tessera. The capture combines retained submissions, original Receipts and the public log prefix with checkpoints. Offline, G5 checks capture correspondence before the frozen P10 chain produces BINDING_MATCH. The Replay Workbench launches the existing verification workflow and displays its records.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; }
      .heading { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .intro { font-size: 20px; fill: #475569; }
      .stage { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #475569; }
      .title { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 18px; fill: #475569; }
      .small { font-size: 16px; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1280" height="960" rx="24" fill="#f8fafc"/>
  <rect x="1" y="1" width="1278" height="958" rx="23" fill="none" stroke="#e2e8f0"/>
  <text x="56" y="65" class="heading">P10 S3</text>
  <text x="56" y="100" class="intro">One live capture. Repeatable offline verification.</text>
  <rect x="925" y="40" width="299" height="42" rx="21" fill="#dcfce7"/>
  <circle cx="946" cy="61" r="5" fill="#15803d"/>
  <text x="962" y="67" font-size="16" font-weight="700" fill="#166534">ACCEPTED + REPRODUCED</text>

  <text x="56" y="149" class="stage">01 / LIVE REGISTRATION</text>
  <rect x="56" y="174" width="280" height="144" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="212" class="title">Signed statements</text>
  <text x="80" y="245" class="body">Issuer signature</text>
  <text x="80" y="272" class="body">Exact statement bytes</text>
  <text x="80" y="298" class="small">P10 lifecycle + declarations</text>

  <rect x="374" y="174" width="510" height="144" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="398" y="212" class="title">Go facade + Tessera</text>
  <text x="398" y="245" class="body">Authenticate issuer → append statement</text>
  <text x="398" y="272" class="body">Confirm published checkpoint → issue Receipt</text>
  <text x="398" y="298" class="small">Issuer checks and log integration happen here.</text>

  <rect x="922" y="174" width="302" height="144" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="946" y="212" class="title">Public log interface</text>
  <text x="946" y="245" class="body">Signed checkpoints</text>
  <text x="946" y="272" class="body">Tiles + entry bundles</text>
  <text x="946" y="298" class="small">Read over HTTP</text>
  <path d="M336 246 H364" class="line"/>
  <path d="M884 246 H912" class="line"/>

  <text x="374" y="409" class="stage">02 / PUBLIC CAPTURE</text>
  <path d="M196 318 V496 H364" class="line"/>
  <text x="70" y="423" class="small">Retained</text>
  <text x="70" y="445" class="small">submissions</text>
  <path d="M629 318 V422" class="line"/>
  <rect x="532" y="355" width="194" height="31" rx="8" fill="#f8fafc"/>
  <text x="547" y="377" class="small">Original Receipts</text>
  <path d="M1073 318 V496 H894" class="line"/>
  <rect x="980" y="355" width="187" height="59" rx="8" fill="#f8fafc"/>
  <text x="995" y="377" class="small">Public prefix</text>
  <text x="995" y="400" class="small">+ checkpoints</text>

  <rect x="374" y="432" width="510" height="144" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="398" y="470" class="title">Capture package</text>
  <text x="398" y="502" class="body">Full prefix + Receipts + public configuration</text>
  <text x="398" y="529" class="body">request.cbor + capture index + recorded anchor</text>
  <text x="398" y="554" class="small">Separate capture client reads the public interface.</text>

  <text x="525" y="612" class="small">Public material only · no private keys</text>
  <rect x="56" y="639" width="1168" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="324" y="666" class="stage">03 / OFFLINE VERIFICATION</text>
  <path d="M470 576 V611 H187 V680" class="line"/>

  <rect x="80" y="690" width="214" height="103" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="102" y="727" class="title">G5 checker</text>
  <text x="102" y="756" class="small">Anchor + byte checks</text>
  <text x="102" y="778" class="small">Capture correspondence</text>
  <path d="M294 741 H314" class="line"/>

  <rect x="324" y="690" width="590" height="103" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="346" y="727" class="title">Frozen P10 chain</text>
  <text x="346" y="758" font-size="20" font-weight="700" fill="#1d4ed8">S2b → tB → S2a / S1 → post-S2a</text>
  <text x="346" y="780" class="small">Existing runner · unchanged verification rules</text>
  <path d="M914 741 H934" class="line"/>

  <rect x="944" y="690" width="256" height="103" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="964" y="727" font-size="23" font-weight="700" fill="#166534">BINDING_MATCH</text>
  <text x="964" y="756" font-size="18" fill="#166534">A1–A15 match</text>
  <text x="964" y="780" font-size="16" fill="#166534">Reproduced verdict bytes</text>

  <rect x="56" y="843" width="1168" height="65" rx="14" fill="#0f172a"/>
  <text x="80" y="871" font-size="20" font-weight="700" fill="#ffffff">Replay Workbench</text>
  <text x="80" y="896" font-size="17" fill="#cbd5e1">Local UI: import → readiness → launch the existing replay → view results → export report</text>
  <text x="56" y="938" class="small">Accepted capture: 8 entries. The same verdict was reproduced on the container host and the HP laptop.</text>
</svg>
